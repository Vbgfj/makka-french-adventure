name: Build Makka French Adventure APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Offline-First Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Configure Pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: 5. Install Project Dependencies
        run: npm install

      - name: 6. Verify Offline Web Assets
        run: |
          test -f www/index.html
          test -f www/css/style.css
          test -f www/js/main.js
          test -f www/data/curriculum.json

      - name: 7. Generate Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: 8. Generate App Icon & Splash Assets
        run: |
          if [ -f "resources/icon.png" ]; then
            mkdir -p assets
            cp resources/icon.png assets/icon.png
            npx capacitor-assets generate --android || true
          fi

      - name: 9. Sync Web Assets into Android
        run: npx cap sync android

      - name: 10. Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 11. Verify Generated APK Exists
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: 12. Upload Makka-French-Adventure-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Makka-French-Adventure-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
